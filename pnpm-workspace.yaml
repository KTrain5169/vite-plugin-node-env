catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.1
  vite-plus: 1.0.0-rc.1
overrides:
  vite@*: "catalog:"
# Force a single physical copy of packages used as peer dependencies.
#
# Temporary: without this, `plugins/node` and each framework playground
# resolved separate copies of Vite (different pnpm peer hashes). Because
# `isRunnableDevEnvironment` is an `instanceof`, a plugin-created environment
# was then invisible to the framework's dev middleware. TODO: fix properly.
dedupePeerDependents: true
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
packages:
  - playgrounds/*
  - plugins/*
minimumReleaseAgeExclude:
  - "@voidzero-dev/vite-plus-core@0.3.3"
  - "@voidzero-dev/vite-plus-darwin-arm64@0.3.3"
  - "@voidzero-dev/vite-plus-darwin-x64@0.3.3"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.3"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@0.3.3"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@0.3.3"
  - "@voidzero-dev/vite-plus-linux-x64-musl@0.3.3"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.3"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@0.3.3"
  - vite-plus@0.3.3
allowBuilds:
  esbuild: false
  workerd: false
